[project]
name = "ds-ensemble-methods"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
required-version = ">=0.13.5"
# Zertifikatskorrekturen anwenden, ohne ungenutzte Laufzeitpakete hinzuzufügen.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
